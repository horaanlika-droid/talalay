<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Cocktail Embassy — Hand-blown glassware</title>
    <meta name="description" content="Cocktail Embassy supplies hand-blown crystal, barware and cocktail acids to bars, hotels and studios. Browse the catalogue and build a trade request.">
    <meta name="theme-color" content="#060c18">
    <meta name="color-scheme" content="dark">
    <link rel="canonical" href="https://horaanlika-droid.github.io/talalay/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Cocktail Embassy">
    <meta property="og:title" content="Cocktail Embassy — Hand-blown glassware">
    <meta property="og:description" content="Levitating crystal, noir coupes and trade acids. Browse the catalogue and build a request.">
    <meta property="og:image" content="assets/brand/og-cover.jpg">
    <meta property="og:url" content="https://horaanlika-droid.github.io/talalay/">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="assets/brand/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Embassy">

    <link rel="preload" as="image" href="assets/brand/ce-logo-chrome.png" fetchpriority="high">
    <link rel="preload" as="image" href="assets/scenes/hero-levitating-martini.webp" media="(min-width: 900px)">
    <link rel="preload" as="image" href="assets/scenes/hero-levitating-martini-portrait.webp" media="(max-width: 899px)">
    <link rel="stylesheet" href="css/app.css">

    <script>
      // Last resort: if the module graph never boots, the catalogue must not stay
      // behind the curtain. The curtain is cosmetic; the shop is the point.
      setTimeout(function () {
        if (document.body.classList.contains("is-ready")) return;
        document.body.classList.remove("is-booting");
        document.body.classList.add("is-ready");
        var boot = document.querySelector("[data-boot]");
        if (boot) {
          boot.classList.add("is-done");
          boot.setAttribute("aria-busy", "false");
        }
      }, 4000);
    </script>
    <script src="js/config.js"></script>
    <script type="module" src="js/app.js"></script>

    <style>
      /* ---------- Opening curtain ----------
         Served inline so the very first paint is already the brand, not a white
         flash. app.js drives the progress hairline and lifts the curtain once the
         catalogue is in hand; the whole opening never lasts less than 1.5 s. */
      html,
      body {
        background: #060c18;
      }
      body.is-booting {
        overflow: hidden;
      }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: grid;
        place-items: center;
        background:
          radial-gradient(120% 80% at 50% 8%, rgba(84, 148, 255, 0.22) 0%, rgba(84, 148, 255, 0) 58%),
          radial-gradient(58% 52% at 50% 46%, #16294a 0%, #0a1428 52%, #060c18 100%);
        transition: opacity 0.7s cubic-bezier(0.32, 0.72, 0, 1), visibility 0.7s;
      }
      .boot.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot__inner {
        display: grid;
        justify-items: center;
        gap: 26px;
        width: min(86vw, 460px);
        padding: 0 8px;
        text-align: center;
      }
      .boot__lockup {
        position: relative;
        width: min(62vw, 300px);
        opacity: 0;
        transform: translateY(10px) scale(0.97);
        animation: boot-lockup 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
      }
      .boot__lockup img {
        width: 100%;
        height: auto;
        display: block;
      }
      .boot__bar {
        position: relative;
        width: 100%;
        height: 1px;
        background: rgba(238, 243, 251, 0.12);
        overflow: visible;
      }
      .boot__bar span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: linear-gradient(90deg, rgba(201, 212, 228, 0.35), #eef3fb 62%, #ffffff);
        box-shadow: 0 0 18px rgba(143, 208, 255, 0.55);
        transition: width 0.55s cubic-bezier(0.32, 0.72, 0, 1);
      }
      .boot__by {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        text-align: center;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.18em;
        color: rgba(238, 243, 251, 0.34);
      }
      @keyframes boot-lockup {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__lockup {
          animation-duration: 0.3s;
        }
      }
    </style>
    <noscript>
      <style>
        .boot {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body class="is-booting">
    <div class="boot" data-boot role="status" aria-busy="true">
      <div class="boot__inner">
        <div class="boot__lockup">
          <img src="assets/brand/ce-logo-chrome.png" alt="Cocktail Embassy" fetchpriority="high">
        </div>
        <div class="boot__bar" aria-hidden="true"><span data-boot-bar></span></div>
      </div>
      <div class="boot__by">app by @stonym0ntana</div>
      <noscript><style>.boot{display:none}</style></noscript>
    </div>

    <div id="app"></div>

    <noscript>
      <div style="min-height:100dvh;padding: 28px; font-family: system-ui, sans-serif; color: #eef3fb; background: #060c18">
        <h1 style="letter-spacing: -0.03em">Cocktail Embassy</h1>
        <p>This catalogue needs JavaScript. Write to
          <a href="mailto:bartending.solution.uae@gmail.com">bartending.solution.uae@gmail.com</a> for the trade catalogue.</p>
      </div>
    </noscript>
  </body>
</html>
